<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="src/table.css" rel="stylesheet"> 
    <title>To Do list</title>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div class="bg-blue-600 text-white h-12 flex items-center justify-center">

    </div>

                <thead>
                    <tr class="bg-slate-100 text-slate-700">

                        <th class="border border-slate-400 p-3 text-sm">rabu</th>
                        <th class="border border-slate-400 p-3 text-sm">kamis</th>
                        <th class="border border-slate-400 p-3 text-sm">jumat</th>
                        <th class="border border-slate-400 p-3 text-sm">sabtu</th>
                        <th class="border border-slate-400 p-3 text-sm">minggu</th>
                    </tr>
                </thead>
                
                <tbody>
                    <tr class="text-slate-900">
                        <td class="border border-slate-400 p-3 text-center text-sm bg-white/50">07-00 am</td>
                        <td class="border border-slate-400 p-3 text-center text-sm bg-white/50">adit</td>
                        <td class="border border-slate-400 p-3 bg-white/30"></td>
                        <td class="border border-slate-400 p-3 bg-white/30">
                            <input class="form-checkbox" type="checkbox">
                            <input type="checkbox">
                            <input type="checkbox">
                            <input type="checkbox">
                        </td>
                        <td class="border border-slate-400 p-3 bg-white/30"></td>
                        <td class="border border-slate-400 p-3 bg-white/30"></td>
                        <td class="border border-slate-400 p-3 bg-white/30"></td>
                        <td class="border border-slate-400 p-3 bg-white/30"></td>
                        <td class="border border-slate-400 p-3 bg-white/30"></td>
                        <td class="border border-slate-400 p-3 bg-white/30"></td>
                    </tr>
                </tbody>
            </table>

        </div>
    </main>

</body>
</html>
